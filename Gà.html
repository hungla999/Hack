<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI BACCARAT SCANNER PRO</title>
    <style>
        body { background: #000; color: #0f0; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        #cam-container { position: relative; width: 100%; max-width: 400px; margin: auto; border: 2px solid #0f0; border-radius: 10px; overflow: hidden; height: 300px; }
        video, canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0; }
        .controls { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-scan { grid-column: span 2; background: #0f0; color: #000; padding: 15px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
        .result-panel { margin-top: 20px; padding: 15px; background: #111; border: 1px solid #333; border-radius: 10px; }
        .highlight { font-size: 1.5rem; color: #fff; text-shadow: 0 0 10px #0f0; }
        #status { font-size: 12px; color: #888; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>AI SCANNER V3.0</h2>
    <div id="status">Đang khởi tạo hệ thống...</div>

    <div id="cam-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div class="controls">
        <button class="btn-scan" onclick="captureAndAnalyze()">QUÉT ẢNH BÀN CHƠI</button>
        <button onclick="manualInput('P')" style="background:#0055ff; color:white;">NHẬP P</button>
        <button onclick="manualInput('B')" style="background:#ff0000; color:white;">NHẬP B</button>
    </div>

    <div class="result-panel">
        <div>DỰ ĐOÁN AI: <span id="prediction" class="highlight">---</span></div>
        <div id="prob" style="font-size: 12px; margin-top: 5px;">Xác suất: P(0%) | B(0%)</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        let history = [];

        // 1. Mở Camera (Bắt buộc dùng HTTPS hoặc Localhost)
        async function initCam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", focusMode: "continuous" } 
                });
                video.srcObject = stream;
                status.innerText = "CAMERA: ONLINE";
            } catch (err) {
                status.innerText = "LỖI: Hãy dùng HTTPS hoặc trình duyệt Chrome/Safari";
                console.error(err);
            }
        }

        // 2. Chụp ảnh và Phân tích điểm ảnh (Pixel Analysis)
        function captureAndAnalyze() {
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Thuật toán: Quét màu tại vùng trung tâm để nhận diện bài lật
            const pixelData = ctx.getImageData(canvas.width/2, canvas.height/2, 10, 10).data;
            let r = pixelData[0], g = pixelData[1], b = pixelData[2];

            // Giả lập logic nhận diện: Nếu đỏ > xanh thì là Banker lật
            if (r > b + 30) manualInput('B');
            else if (b > r + 30) manualInput('P');
            else alert("AI chưa nhận diện rõ. Hãy đưa cam lại gần lá bài!");
        }

        // 3. Bộ não Markov Chain xử lý kết quả
        function manualInput(res) {
            history.push(res);
            if (history.length > 30) history.shift();
            
            // Tính xác suất
            let last = history[history.length - 1];
            let counts = { P: 0, B: 0 };
            for (let i = 0; i < history.length - 1; i++) {
                if (history[i] === last) counts[history[i+1]]++;
            }

            let total = counts.P + counts.B;
            let pP = total ? Math.round((counts.P/total)*100) : 50;
            let pB = total ? Math.round((counts.B/total)*100) : 50;

            document.getElementById('prob').innerText = `Xác suất: P(${pP}%) | B(${pB}%)`;
            document.getElementById('prediction').innerText = pP > pB ? "PLAYER 🔵" : (pB > pP ? "BANKER 🔴" : "CHỜ CẦU...");
        }

        initCam();
    </script>
</body>
</html>
